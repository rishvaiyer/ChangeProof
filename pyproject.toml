[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changeproof"
version = "0.1.0"
description = "ChangeProof DataHub hackathon scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "acryl-datahub",
  "dbt-core",
  "dbt-duckdb",
  "fastapi",
  "httpx",
  "mcp",
  "openai",
  "pydantic",
  "pydantic-settings",
  "sqlglot",
  "typer",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
